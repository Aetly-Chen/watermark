# JVM 参数：机器只有 15.4 GB 内存，别用模板默认的 -Xmx8G
# -Dfile.encoding=UTF-8 必须给：工程路径含中文，缺了会导致资源/日志出现乱码
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError

android.useAndroidX=true

# AGP 会拦「路径含非 ASCII 字符」，本项目就落在 D:/项目/watermark 下。
# 关掉这条检查：Windows 上真正的风险是 aapt2/资源编译，若后续出现资源类错误再考虑搬迁工程。
android.overridePathCheck=true

# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
